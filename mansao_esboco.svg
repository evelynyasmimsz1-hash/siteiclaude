<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <!-- Céu com gradiente -->
  <defs>
    <linearGradient id="ceu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8d0e6"/>
      <stop offset="100%" stop-color="#f4e1c1"/>
    </linearGradient>
    <linearGradient id="parede" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f1ea"/>
      <stop offset="100%" stop-color="#e0d8cc"/>
    </linearGradient>
    <linearGradient id="madeira" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="100%" stop-color="#5c3a1e"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a5a6c"/>
      <stop offset="100%" stop-color="#6b8a9a"/>
    </linearGradient>
    <linearGradient id="piso" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a888"/>
      <stop offset="100%" stop-color="#8a7a5a"/>
    </linearGradient>
  </defs>

  <!-- Fundo céu -->
  <rect x="0" y="0" width="1200" height="500" fill="url(#ceu)"/>

  <!-- Sol suave -->
  <circle cx="950" cy="120" r="50" fill="#fff4d6" opacity="0.6"/>

  <!-- Grama lateral -->
  <rect x="0" y="500" width="1200" height="200" fill="#7ba05b"/>
  <rect x="0" y="495" width="1200" height="15" fill="#8db870"/>

  <!-- Calçada/piso da garagem -->
  <polygon points="350,500 850,500 950,680 250,680" fill="url(#piso)"/>
  <line x1="350" y1="500" x2="250" y2="680" stroke="#7a6a4a" stroke-width="2"/>
  <line x1="600" y1="500" x2="600" y2="680" stroke="#7a6a4a" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="850" y1="500" x2="950" y2="680" stroke="#7a6a4a" stroke-width="2"/>

  <!-- Vaga de garagem (frente) - linhas demarcando -->
  <line x1="430" y1="540" x2="380" y2="640" stroke="#fff" stroke-width="3" opacity="0.7"/>
  <line x1="770" y1="540" x2="820" y2="640" stroke="#fff" stroke-width="3" opacity="0.7"/>

  <!-- Carro estacionado (sedan elegante) -->
  <g transform="translate(500, 555)">
    <!-- Sombra -->
    <ellipse cx="100" cy="80" rx="110" ry="8" fill="#000" opacity="0.25"/>
    <!-- Corpo do carro -->
    <path d="M 10,60 Q 10,40 35,38 L 60,20 Q 75,12 100,12 L 130,12 Q 155,12 170,20 L 195,38 Q 210,40 210,60 L 210,72 L 10,72 Z" fill="#1a1a2e"/>
    <!-- Vidros -->
    <path d="M 55,38 L 75,22 Q 85,18 100,18 L 130,18 Q 145,18 155,22 L 175,38 Z" fill="#5a7a8a" opacity="0.85"/>
    <line x1="115" y1="20" x2="115" y2="38" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Detalhe inferior -->
    <rect x="10" y="60" width="200" height="4" fill="#3a3a4e"/>
    <!-- Rodas -->
    <circle cx="50" cy="72" r="14" fill="#222"/>
    <circle cx="50" cy="72" r="7" fill="#888"/>
    <circle cx="170" cy="72" r="14" fill="#222"/>
    <circle cx="170" cy="72" r="7" fill="#888"/>
    <!-- Farol -->
    <ellipse cx="208" cy="50" rx="4" ry="3" fill="#ffeb99"/>
  </g>

  <!-- TELHADO PRINCIPAL (baixo, moderno) -->
  <polygon points="180,290 1020,290 1060,330 140,330" fill="#3a3a3a"/>
  <polygon points="200,260 1000,260 1020,290 180,290" fill="#2a2a2a"/>

  <!-- Beiral fino -->
  <rect x="140" y="328" width="920" height="8" fill="#1a1a1a"/>

  <!-- CORPO PRINCIPAL DA MANSÃO -->
  <rect x="180" y="336" width="840" height="164" fill="url(#parede)"/>

  <!-- Detalhe horizontal de pedra na base -->
  <rect x="180" y="475" width="840" height="25" fill="#9a8a7a"/>
  <line x1="180" y1="487" x2="1020" y2="487" stroke="#7a6a5a" stroke-width="1"/>
  <g stroke="#7a6a5a" stroke-width="0.8" opacity="0.6">
    <line x1="220" y1="475" x2="220" y2="487"/>
    <line x1="270" y1="487" x2="270" y2="500"/>
    <line x1="320" y1="475" x2="320" y2="487"/>
    <line x1="370" y1="487" x2="370" y2="500"/>
    <line x1="420" y1="475" x2="420" y2="487"/>
    <line x1="470" y1="487" x2="470" y2="500"/>
    <line x1="520" y1="475" x2="520" y2="487"/>
    <line x1="570" y1="487" x2="570" y2="500"/>
    <line x1="620" y1="475" x2="620" y2="487"/>
    <line x1="670" y1="487" x2="670" y2="500"/>
    <line x1="720" y1="475" x2="720" y2="487"/>
    <line x1="770" y1="487" x2="770" y2="500"/>
    <line x1="820" y1="475" x2="820" y2="487"/>
    <line x1="870" y1="487" x2="870" y2="500"/>
    <line x1="920" y1="475" x2="920" y2="487"/>
    <line x1="970" y1="487" x2="970" y2="500"/>
  </g>

  <!-- ALA ESQUERDA: Janelas amplas -->
  <rect x="210" y="360" width="160" height="100" fill="url(#vidro)"/>
  <rect x="210" y="360" width="160" height="100" fill="none" stroke="#2a2a2a" stroke-width="3"/>
  <line x1="290" y1="360" x2="290" y2="460" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="210" y1="410" x2="370" y2="410" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Reflexo de vidro -->
  <polygon points="220,365 235,365 215,455 200,455" fill="#fff" opacity="0.15"/>

  <!-- Coluna decorativa entre janelas -->
  <rect x="385" y="336" width="15" height="139" fill="#d8cdb8"/>
  <rect x="385" y="336" width="15" height="5" fill="#9a8a7a"/>
  <rect x="385" y="470" width="15" height="5" fill="#9a8a7a"/>

  <!-- ENTRADA CENTRAL: Pórtico elevado -->
  <!-- Telhado do pórtico -->
  <polygon points="500,300 700,300 720,336 480,336" fill="#2a2a2a"/>
  <rect x="478" y="334" width="244" height="6" fill="#1a1a1a"/>

  <!-- Colunas do pórtico -->
  <rect x="495" y="340" width="18" height="135" fill="#f0e8d8"/>
  <rect x="490" y="335" width="28" height="8" fill="#d8cdb8"/>
  <rect x="490" y="472" width="28" height="6" fill="#9a8a7a"/>

  <rect x="687" y="340" width="18" height="135" fill="#f0e8d8"/>
  <rect x="682" y="335" width="28" height="8" fill="#d8cdb8"/>
  <rect x="682" y="472" width="28" height="6" fill="#9a8a7a"/>

  <!-- Porta de entrada (madeira nobre, dupla) -->
  <rect x="540" y="370" width="120" height="105" fill="url(#madeira)"/>
  <rect x="540" y="370" width="120" height="105" fill="none" stroke="#3a2a1a" stroke-width="2"/>
  <line x1="600" y1="370" x2="600" y2="475" stroke="#3a2a1a" stroke-width="2"/>
  <!-- Detalhes da porta -->
  <rect x="550" y="385" width="40" height="35" fill="none" stroke="#3a2a1a" stroke-width="1"/>
  <rect x="610" y="385" width="40" height="35" fill="none" stroke="#3a2a1a" stroke-width="1"/>
  <rect x="550" y="430" width="40" height="35" fill="none" stroke="#3a2a1a" stroke-width="1"/>
  <rect x="610" y="430" width="40" height="35" fill="none" stroke="#3a2a1a" stroke-width="1"/>
  <!-- Maçanetas -->
  <circle cx="595" cy="425" r="2.5" fill="#d4af37"/>
  <circle cx="605" cy="425" r="2.5" fill="#d4af37"/>

  <!-- Janela transom acima da porta -->
  <rect x="540" y="350" width="120" height="18" fill="url(#vidro)"/>
  <rect x="540" y="350" width="120" height="18" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="580" y1="350" x2="580" y2="368" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="620" y1="350" x2="620" y2="368" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Escada de entrada -->
  <rect x="510" y="476" width="180" height="6" fill="#c8b898"/>
  <rect x="500" y="482" width="200" height="6" fill="#b8a888"/>
  <rect x="490" y="488" width="220" height="6" fill="#a89878"/>

  <!-- Coluna decorativa direita -->
  <rect x="800" y="336" width="15" height="139" fill="#d8cdb8"/>
  <rect x="800" y="336" width="15" height="5" fill="#9a8a7a"/>
  <rect x="800" y="470" width="15" height="5" fill="#9a8a7a"/>

  <!-- ALA DIREITA: Janelas amplas -->
  <rect x="830" y="360" width="160" height="100" fill="url(#vidro)"/>
  <rect x="830" y="360" width="160" height="100" fill="none" stroke="#2a2a2a" stroke-width="3"/>
  <line x1="910" y1="360" x2="910" y2="460" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="830" y1="410" x2="990" y2="410" stroke="#2a2a2a" stroke-width="1.5"/>
  <polygon points="840,365 855,365 835,455 820,455" fill="#fff" opacity="0.15"/>

  <!-- Luminárias externas (laterais da porta) -->
  <rect x="525" y="395" width="4" height="20" fill="#1a1a1a"/>
  <circle cx="527" cy="392" r="5" fill="#ffeb99" opacity="0.9"/>
  <rect x="671" y="395" width="4" height="20" fill="#1a1a1a"/>
  <circle cx="673" cy="392" r="5" fill="#ffeb99" opacity="0.9"/>

  <!-- Arbustos decorativos -->
  <g>
    <circle cx="170" cy="510" r="22" fill="#4a6a3a"/>
    <circle cx="190" cy="505" r="18" fill="#5a7a4a"/>
    <circle cx="160" cy="495" r="15" fill="#6a8a5a"/>
  </g>
  <g>
    <circle cx="1030" cy="510" r="22" fill="#4a6a3a"/>
    <circle cx="1010" cy="505" r="18" fill="#5a7a4a"/>
    <circle cx="1040" cy="495" r="15" fill="#6a8a5a"/>
  </g>

  <!-- Vasos próximos à entrada -->
  <g transform="translate(490, 460)">
    <rect x="0" y="10" width="15" height="18" fill="#9a8a7a"/>
    <ellipse cx="7" cy="8" rx="12" ry="6" fill="#5a7a4a"/>
    <circle cx="3" cy="3" r="4" fill="#6a8a5a"/>
    <circle cx="12" cy="2" r="4" fill="#6a8a5a"/>
  </g>
  <g transform="translate(695, 460)">
    <rect x="0" y="10" width="15" height="18" fill="#9a8a7a"/>
    <ellipse cx="7" cy="8" rx="12" ry="6" fill="#5a7a4a"/>
    <circle cx="3" cy="3" r="4" fill="#6a8a5a"/>
    <circle cx="12" cy="2" r="4" fill="#6a8a5a"/>
  </g>

  <!-- Árvore decorativa fundo -->
  <g transform="translate(80, 380)">
    <rect x="20" y="80" width="12" height="50" fill="#5c3a1e"/>
    <circle cx="26" cy="60" r="40" fill="#4a6a3a"/>
    <circle cx="10" cy="55" r="28" fill="#5a7a4a"/>
    <circle cx="45" cy="50" r="30" fill="#5a7a4a"/>
    <circle cx="26" cy="35" r="25" fill="#6a8a5a"/>
  </g>
  <g transform="translate(1080, 380)">
    <rect x="20" y="80" width="12" height="50" fill="#5c3a1e"/>
    <circle cx="26" cy="60" r="40" fill="#4a6a3a"/>
    <circle cx="10" cy="55" r="28" fill="#5a7a4a"/>
    <circle cx="45" cy="50" r="30" fill="#5a7a4a"/>
    <circle cx="26" cy="35" r="25" fill="#6a8a5a"/>
  </g>

  <!-- Nuvens suaves -->
  <g fill="#fff" opacity="0.7">
    <ellipse cx="200" cy="100" rx="50" ry="15"/>
    <ellipse cx="230" cy="95" rx="35" ry="12"/>
    <ellipse cx="700" cy="80" rx="60" ry="18"/>
    <ellipse cx="740" cy="75" rx="40" ry="14"/>
  </g>

  <!-- Título/legenda -->
  <text x="600" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#3a3a3a" font-style="italic">Mansão Térrea — Esboço Arquitetônico</text>
</svg>
